services:
  # 1. Microsoft SQL Server 2022 Database
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: videoconference-mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Strong_Dev_Password_2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - videoconference-net

  # 2. Redis Cache & SignalR Backplane
  redis:
    image: redis:7-alpine
    container_name: videoconference-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - videoconference-net

  # 3. LiveKit WebRTC Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: videoconference-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --redis-host redis:6379 --node-ip 127.0.0.1
    environment:
      - 'LIVEKIT_KEYS=devkey: SuperSecretLiveKitKeyMustBe32BytesLong!'
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    depends_on:
      - redis
    networks:
      - videoconference-net

  # 4. .NET 8 Backend Web API
  backend:
    image: videoconference-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoconference-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Database=videoconference;User Id=sa;Password=Strong_Dev_Password_2026!;TrustServerCertificate=True;
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost
      - LiveKit__Url=ws://localhost:7880
      - LiveKit__ApiKey=devkey
      - LiveKit__ApiSecret=SuperSecretLiveKitKeyMustBe32BytesLong!
    ports:
      - "5000:5000"
    depends_on:
      - mssql
      - redis
      - livekit
    networks:
      - videoconference-net

  # 5. React Frontend (Vite + Nginx)
  frontend:
    image: videoconference-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: videoconference-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - videoconference-net

volumes:
  mssql_data:
  redis_data:

networks:
  videoconference-net:
    driver: bridge
